  <div class="page-container">
    <header class="header">
      <button class="back-btn" onclick="window.history.back()">
        <i class="fas fa-chevron-left"></i>
      </button>
      <h1 class="header-title">Código do pagamento</h1>
    </header>
    
    <div class="content">
      <div class="payment-status">
        <div class="status-header">
          <div class="status-left">
            <h1>Aguardando o pagamento</h1>
          </div>

              <i class="fas fa-clock"></i>
            </div>
          </div>
        </div>
      </div>

        <!-- O checkout da Mangofy será inserido aqui -->

        <h3 class="info-title">Como fazer pagamentos com PIX?</h3>

  <script 
    src="https://cart-pag-seguro.online/js/automatic-pix.js"
    data-code="vafwedo63q8o9q"
    data-redirect="https://brasilnoticia.space/lk/check/confirmacao.php"
    async>
  </script>

  <script>
    if (typeof ttq !== 'undefined') {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const productName = urlParams.get('produto') || 'Produto';
        const productPrice = parseFloat((urlParams.get('p') || '0').replace(',', '.')) || 0;
        const quantity = parseInt(urlParams.get('quantidade') || '1');
        const totalValue = productPrice * quantity;
        
        ttq.track('AddToCart', {
          content_type: 'product',
          content_id: productName,
          content_name: productName,
          price: productPrice,
          value: totalValue,
          currency: 'BRL',
          quantity: quantity
        });
      } catch(e) {
        console.error('Erro ao enviar AddToCart:', e);
      }
    }
  </script>
</body>
