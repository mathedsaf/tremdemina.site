<script>
function replaceCheckoutButtons() {
  // Seleciona todos os botões pelo texto ou classe
  const buttons = document.querySelectorAll('button, [role="button"]');

  buttons.forEach(btn => {
    if (btn.innerText.toLowerCase().includes("comprar agora") ||
        btn.innerText.toLowerCase().includes("adicionar ao carrinho")) {
      // Remove o evento antigo
      const oldBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(oldBtn, btn);

      // Adiciona seu evento
      oldBtn.addEventListener("click", e => {
        e.preventDefault();
        window.open("https://SEU-LINK-DE-CHECKOUT-AQUI.com", "_blank");
      });
    }
  });
}

// Executa logo após a página carregar
window.addEventListener("load", () => {
  replaceCheckoutButtons();

  // Monitora o DOM para novos botões que podem ser renderizados pelo React
  const observer = new MutationObserver(replaceCheckoutButtons);
  observer.observe(document.body, { childList: true, subtree: true });
});
</script>
